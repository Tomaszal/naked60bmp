[package]
name = "naked60bmp"
version = "0.1.0"
edition = "2024"
publish = false
build = "src/build.rs"

[[bin]]
name = "naked60bmp"
test = false
bench = false

[[bin]]
name = "naked60bmp-dongle"
path = "src/dongle.rs"
test = false
bench = false

[dependencies]
# RMK 0.9.0 rejects BIOS boot-protocol requests (https://github.com/rmk-rs/rmk/pull/1107).
# Pin upstream with that fix, boot-mode report filtering and USB reset recovery until released.
rmk = { git = "https://github.com/rmk-rs/rmk", rev = "aacd1d07255f476cd91d9dd8ab8af56afd22ce4a", default-features = false, features = ["defmt", "storage", "vial", "host_lock", "dongle", "watchdog", "async_matrix", "nrf52840_ble", "adafruit_bl"] }
# Match the pinned RMK revision's nRF examples and bt-hci 0.11 controller API.
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc", rev = "9cf87fa7883b89b2d4dc7cd94864da7927bd858c", features = ["defmt", "peripheral", "central", "nrf52840"] }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc", rev = "9cf87fa7883b89b2d4dc7cd94864da7927bd858c", features = ["defmt", "critical-section-impl", "nrf52840"] }
bt-hci = { version = "0.11", features = ["defmt"] }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt"] }
embassy-nrf = { version = "0.11", features = ["defmt", "nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac", "nfc-pins-as-gpio", "time"] }
embassy-executor = { version = "0.10", features = ["defmt", "platform-cortex-m", "executor-thread"] }
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"

[build-dependencies]
json = "0.12"
xz2 = "0.1.7"

[profile.release]
codegen-units = 1
debug = 2
opt-level = "z"
overflow-checks = false
lto = "fat"
